[build]
  base    = "."
  command = "pnpm turbo run build --filter=@spike/web..."
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  # Pre-filled public values — no secrets here
  NEXT_PUBLIC_PQC_KEY_REGISTRY = "0x300Fa0Af86201A410bEBD511Ca7FB81548a0f027"
  NEXT_PUBLIC_AGENT_REGISTRY   = "0x5bBE9D2735EEfDF453f71fe3f2bcD3E1cb8CB8B0"
  NEXT_PUBLIC_ZG_NETWORK       = "testnet"

# Serve WebAssembly with the correct content-type
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

